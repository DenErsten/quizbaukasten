<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<title>Aufnahme</title>
<link rel="stylesheet" href="stil.css" />
</head>
<body>
<header class="kopfzeile">
  <span class="marke">Werkzeuge</span>
  <nav>
    <a href="aufnahme.html" aria-current="page">Aufnahme</a>
    <a href="freigabe.html">Freigaben</a>
    <a href="fortschritt.html">Fortschritt</a>
  </nav>
</header>
<main>
<div id="aufnahme"></div>
</main>
<script type="module">
  import { ZUSTAND, naechsterZustand, zustandZuHtml } from "./aufnahme.js";

  const container = document.getElementById("aufnahme");
  let zustand = { art: ZUSTAND.BEREIT };
  let gestartetUm = null;
  let liefZuletzt = false;

  function rendern() {
    container.innerHTML = zustandZuHtml(zustand);
    const start = document.getElementById("start");
    const stop = document.getElementById("stop");
    if (start) start.addEventListener("click", () => auslösen("/aufnahme/start"));
    if (stop) stop.addEventListener("click", () => auslösen("/aufnahme/stop"));
  }

  async function auslösen(pfad) {
    try {
      await fetch(pfad, { method: "POST" });
    } catch (fehler) {
      console.warn("Aufnahme: Anfrage nicht angekommen", fehler);
    }
    await aktualisieren();
  }

  async function aktualisieren() {
    try {
      const statusAntwort = await fetch("/status", { cache: "no-store" });
      if (!statusAntwort.ok) throw new Error("status nicht ok");
      const status = await statusAntwort.json();

      if (status.laeuft) {
        liefZuletzt = true;
        if (gestartetUm === null) gestartetUm = new Date(status.seit).getTime();
        const [hinweiseAntwort, transkriptAntwort] = await Promise.all([
          fetch("/hinweise", { cache: "no-store" }),
          fetch("/transkript", { cache: "no-store" }),
        ]);
        const hinweise = hinweiseAntwort.ok ? await hinweiseAntwort.json() : [];
        const transkript = transkriptAntwort.ok ? await transkriptAntwort.json() : [];
        zustand = naechsterZustand(zustand, {
          art: ZUSTAND.LAEUFT,
          sekunden: (Date.now() - gestartetUm) / 1000,
          hinweise,
          transkript,
        });
      } else if (liefZuletzt) {
        liefZuletzt = false;
        gestartetUm = null;
        zustand = naechsterZustand(zustand, {
          art: ZUSTAND.BEENDET,
          anzahlHinweise: status.hinweise ?? 0,
          anforderungenUrl: "../anforderungen/",
        });
      } else {
        zustand = naechsterZustand(zustand, { art: ZUSTAND.BEREIT });
      }
    } catch (fehler) {
      console.debug("Aufnahme: Verbindung verloren", fehler);
      zustand = naechsterZustand(zustand, null);
    }
    rendern();
  }

  aktualisieren();
  setInterval(aktualisieren, 1000);
</script>
</body>
</html>

<style>
  /* Das Gehoerte neben der Arbeit — bei schmalem Fenster darueber. */
  .aufnahme-laeuft { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; align-items: start; }
  .aufnahme-laeuft .zeit, .aufnahme-laeuft > .knoepfe { grid-column: 1 / -1; }
  .transkript .titel { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em;
                       opacity: .6; margin: 0 0 .5rem; }
  .transkript .satz { margin: 0 0 .35rem; font-size: .92rem; }
  .transkript .satz .zeit { display: inline-block; min-width: 3rem; opacity: .5;
                            font-variant-numeric: tabular-nums; font-size: .82rem; }
  .transkript .leer { opacity: .5; font-size: .88rem; font-style: italic; }
  @media (max-width: 640px) {
    .aufnahme-laeuft { grid-template-columns: 1fr; }
  }
</style>
