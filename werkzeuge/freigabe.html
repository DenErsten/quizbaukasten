<!doctype html>
<meta charset="utf-8" />
<title>Freigaben</title>
<!--
  Lokales Werkzeug. Aufruf:
      python3 werkzeuge/server.py
      → http://localhost:8000/freigabe.html

  Arbeitet mit Firats gh-Anmeldung, nicht mit dem Bot-Token. Was hier
  freigegeben wird, trägt seinen Namen — sonst wäre Gate G2 eine Attrappe.
-->
<style>
  body { margin: 0; padding: 1.5rem 2rem; font: 15px/1.55 system-ui, sans-serif;
         background: #14201d; color: #e8efec; max-width: 60rem; }
  h1 { font-size: 1.3rem; font-weight: 600; margin: 0 0 1.5rem; }
  h2 { font-size: 1rem; font-weight: 600; color: #9fd3c0; margin: 2rem 0 .8rem; }
  .eintrag { border-left: 3px solid #3d5a52; padding: .6rem 0 .7rem .9rem; margin-bottom: 1rem; }
  .eintrag.unvollstaendig { border-left-color: #c2703f; }
  .kopf { margin: 0 0 .3rem; }
  .nummer { color: #7d928b; margin-right: .5rem; font-variant-numeric: tabular-nums; }
  .marken { margin: 0 0 .4rem; }
  .marke { display: inline-block; background: #22332e; color: #9fb5ad;
           padding: .05rem .5rem; border-radius: 3px; margin-right: .4rem; font-size: .8rem; }
  .marke.fehlt { background: #4a2f22; color: #e0a87f; }
  .warnung { margin: .2rem 0 .5rem; color: #e0a87f; font-size: .88rem; }
  .gut { margin: .2rem 0 .5rem; color: #7d928b; font-size: .88rem; }
  .dateien { margin: .2rem 0 .5rem; color: #566b64; font-size: .8rem; }
  .knoepfe button { background: #22332e; color: #e8efec; border: 1px solid #3d5a52;
                    padding: .3rem .9rem; border-radius: 4px; margin-right: .5rem; cursor: pointer; }
  .knoepfe button:hover:not(:disabled) { background: #2d4a41; }
  .knoepfe button:disabled { opacity: .4; cursor: default; }
  .leer, .stand { color: #566b64; }
  .stand { margin-top: 1.5rem; font-size: .85rem; }
</style>
<h1>Was auf dich wartet</h1>
<main id="konsole"><p class="leer">Wird geladen …</p></main>
<p class="stand" id="stand"></p>
<script type="module">
  import { konsoleZuHtml } from "/freigabe.js";

  const konsole = document.getElementById("konsole");
  const stand = document.getElementById("stand");

  async function laden() {
    try {
      const antwort = await fetch("/freigaben", { cache: "no-store" });
      const daten = await antwort.json();
      if (daten.fehler) {
        stand.textContent = `Fehler: ${daten.fehler}`;
        return;
      }
      konsole.innerHTML = konsoleZuHtml(daten);
      stand.textContent = `Stand: ${new Date().toLocaleTimeString("de-DE")}`;
    } catch (fehler) {
      // Was dasteht, bleibt stehen — ein leeres Fenster ist schlechter als
      // ein veralteter Stand. Aber schweigen darf der Fehler nicht.
      stand.textContent = `Nicht erreichbar: ${fehler.message}`;
    }
  }

  konsole.addEventListener("click", async (e) => {
    const knopf = e.target.closest("button[data-tat]");
    if (!knopf) return;
    const { tat, art, nummer } = knopf.dataset;

    let weg = `/freigabe/${art}/${nummer}`;
    let koerper = null;
    if (tat === "kommentieren") {
      const text = prompt(`Rückfrage an ${art === "pr" ? "PR" : "Issue"} #${nummer}:`);
      if (!text) return;
      weg = `/kommentar/${art}/${nummer}`;
      koerper = JSON.stringify({ text });
    }

    knopf.disabled = true;
    const antwort = await fetch(weg, {
      method: "POST",
      headers: koerper ? { "Content-Type": "application/json" } : {},
      body: koerper,
    });
    const daten = await antwort.json();
    if (daten.fehler) {
      stand.textContent = `Fehler: ${daten.fehler}`;
      knopf.disabled = false;
      return;
    }
    await laden();
  });

  laden();
  setInterval(laden, 15000);
</script>
