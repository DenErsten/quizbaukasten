<!doctype html>
<meta charset="utf-8" />
<title>Freigaben</title>
<!--
  Lokales Werkzeug. Aufruf:
      python3 werkzeuge/server.py
      → http://localhost:8000/freigabe.html

  Arbeitet mit Firats gh-Anmeldung, nicht mit dem Bot-Token. Was hier
  freigegeben wird, trägt seinen Namen — sonst wäre Gate G2 eine Attrappe.
-->
<link rel="stylesheet" href="stil.css" />
<header class="kopfzeile">
  <span class="marke">Werkzeuge</span>
  <nav>
    <a href="aufnahme.html">Aufnahme</a>
    <a href="freigabe.html" aria-current="page">Freigaben</a>
    <span class="bald" title="Noch nicht gebaut">Fortschritt</span>
  </nav>
</header>
<main>
<h1>Was auf dich wartet</h1>
<div id="konsole"><p class="leer">Wird geladen …</p></div>
<p class="stand" id="stand"></p>
</main>
<script type="module">
  import { konsoleZuHtml } from "/freigabe.js";

  const konsole = document.getElementById("konsole");
  const stand = document.getElementById("stand");

  async function laden() {
    try {
      const antwort = await fetch("/freigaben", { cache: "no-store" });
      const daten = await antwort.json();
      if (daten.fehler) {
        stand.textContent = `Fehler: ${daten.fehler}`;
        return;
      }
      konsole.innerHTML = konsoleZuHtml(daten);
      stand.textContent = `Stand: ${new Date().toLocaleTimeString("de-DE")}`;
    } catch (fehler) {
      // Was dasteht, bleibt stehen — ein leeres Fenster ist schlechter als
      // ein veralteter Stand. Aber schweigen darf der Fehler nicht.
      stand.textContent = `Nicht erreichbar: ${fehler.message}`;
    }
  }

  konsole.addEventListener("click", async (e) => {
    const knopf = e.target.closest("button[data-tat]");
    if (!knopf) return;
    const { tat, art, nummer } = knopf.dataset;

    let weg = `/freigabe/${art}/${nummer}`;
    let koerper = null;
    if (tat === "kommentieren") {
      const text = prompt(`Rückfrage an ${art === "pr" ? "PR" : "Issue"} #${nummer}:`);
      if (!text) return;
      weg = `/kommentar/${art}/${nummer}`;
      koerper = JSON.stringify({ text });
    }

    knopf.disabled = true;
    const antwort = await fetch(weg, {
      method: "POST",
      headers: koerper ? { "Content-Type": "application/json" } : {},
      body: koerper,
    });
    const daten = await antwort.json();
    if (daten.fehler) {
      stand.textContent = `Fehler: ${daten.fehler}`;
      knopf.disabled = false;
      return;
    }
    await laden();
  });

  laden();
  setInterval(laden, 15000);
</script>
