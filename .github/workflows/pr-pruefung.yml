name: PR-Prüfung

# Vier Gates vor jedem Merge. Alle vier sind Required Status Checks auf main
# (siehe scripts/setup-repo.sh) — was hier rot ist, wird nicht gemergt,
# auch nicht von einem Admin.
#
#   pfade    — fasst der PR die Leitplanken an?
#   pruefen  — halten Tests, Typen und Build?
#   review   — was sagt ein zweiter Agent mit anderer Rolle?
#   abnahme  — ist das Abnahmekriterium des Issues nachweislich erfüllt?
#
# Der letzte Job schaltet Auto-Merge frei. Mergen tut GitHub selbst, erst
# wenn alle vier grün sind. Der Agent kann das nicht abkürzen: er hat
# Contents- und PR-Rechte, aber keine Administration-Rechte.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

# Einreihen statt abbrechen. Ein abgebrochener Lauf hinterlaesst Check-Runs
# mit conclusion "cancelled", und die zaehlen fuer die Branch Protection nicht
# als bestanden. Zwischen dem 11. und 12.09. musste ich sechsmal von Hand
# "gh run rerun --failed" ausfuehren, damit ein PR mergen konnte, dessen
# juengster Lauf vollstaendig gruen war. Das kostete je zwei bis fuenf Minuten
# und schuetzte vor nichts.
#
# Der Preis ist Wartezeit statt Abbruch: Genehmigt jemand, waehrend noch ein
# Lauf laeuft, stellt sich der neue an, statt den alten zu toeten. Er startet
# spaeter und schreibt zuletzt — was genau die Reihenfolge ist, die man will.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

jobs:
  # ---------------------------------------------------------------- 0
  # claude-code-action weigert sich zu laufen, wenn die Workflow-Datei im PR
  # von der auf dem Zielbranch abweicht ("workflow validation"). Das ist ihre
  # Sicherung gegen einen PR, der den Pruefer umschreibt und sich anschliessend
  # von dem veraenderten Pruefer begutachten laesst. Sie ist richtig.
  #
  # Fuer uns heisst das: review und abnahme liefern fuer solche PRs grundsaetz-
  # lich kein Urteil, und die Auswertung blockiert dann im Zweifel. Ohne diesen
  # Job waere das Repo an seinen eigenen Workflows nicht mehr wartbar — auch
  # nicht von einem Menschen, weil enforce_admins keine Ausnahme kennt.
  #
  # Die Pruefung faellt nicht weg, sie wechselt den Traeger: Fuer genau diese
  # Pfade verlangt "pfade" bereits die Freigabe eines Menschen aus
  # scripts/menschen.txt. Wer den Diff gelesen hat, prueft hier besser als ein
  # Agent, der ueber seine eigenen Regeln urteilen soll. Siehe #12.
  umfang:
    name: umfang
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      workflows: ${{ steps.ermitteln.outputs.workflows }}
    steps:
      - name: Ändert dieser PR die Workflows?
        id: ermitteln
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NR: ${{ github.event.pull_request.number }}
        run: |
          if gh pr diff "$NR" --name-only | grep -q '^\.github/workflows/'; then
            echo "workflows=true" >> "$GITHUB_OUTPUT"
            echo "Dieser PR ändert .github/workflows/." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "review und abnahme können hier nicht urteilen — siehe Job-Hinweis." \
              | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "workflows=false" >> "$GITHUB_OUTPUT"
            echo "Keine Workflow-Änderung. Agenten-Checks urteilen normal." \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  # ---------------------------------------------------------------- 1
  pfade:
    name: pfade
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Geschützte Pfade prüfen
        env:
          GH_TOKEN: ${{ github.token }}
          NR: ${{ github.event.pull_request.number }}
        run: |
          gh pr diff "$NR" --name-only > /tmp/geaendert.txt
          gh pr view "$NR" --json reviews,files > /tmp/pr.json

          # Kein "| tee". Der Exit-Code einer Pipeline ist der des letzten
          # Glieds, und tee liefert immer 0 — der Waechter hat dadurch gemeldet,
          # was er fand, ohne jemals etwas aufzuhalten. Schritte laufen mit
          # bash -e, aber ohne pipefail; darauf darf sich hier nichts verlassen.
          set +e
          python3 scripts/pfad_pruefung.py \
            --geaendert /tmp/geaendert.txt \
            --pr /tmp/pr.json > /tmp/bericht.txt
          ergebnis=$?
          set -e

          cat /tmp/bericht.txt
          echo "ergebnis=$ergebnis" >> "$GITHUB_OUTPUT"
          exit $ergebnis
        continue-on-error: true
        id: pruefung

      - name: Ergebnis melden und durchreichen
        env:
          GH_TOKEN: ${{ github.token }}
          NR: ${{ github.event.pull_request.number }}
        run: |
          cat /tmp/bericht.txt >> "$GITHUB_STEP_SUMMARY"
          ergebnis="${{ steps.pruefung.outputs.ergebnis }}"

          # 0 = frei, 1 = geschuetzter Pfad ohne Freigabe, 2 = der Waechter
          # selbst ist kaputt (fehlende Musterdatei). Nur 0 darf durch.
          if [ "$ergebnis" = "0" ]; then
            exit 0
          fi

          if [ "$ergebnis" != "1" ]; then
            echo "::error::Der Pfad-Wächter konnte nicht urteilen (Exit $ergebnis)."
            echo "::error::Im Zweifel blockiert — ein kaputter Wächter ist kein freier Weg."
            exit 1
          fi

          # Nur einmal kommentieren, nicht bei jedem Push erneut.
          if ! gh pr view "$NR" --json comments \
               --jq '.comments[].body' | grep -q "Pfad-Wächter"; then
            {
              echo "**Pfad-Wächter:** Dieser PR ändert Dateien, die festlegen,"
              echo "wie die KI entscheidet. Merge bleibt blockiert, bis ein Mensch"
              echo "aus \`scripts/menschen.txt\` den PR freigibt."
              echo
              echo '```'
              cat /tmp/bericht.txt
              echo '```'
            } | gh pr comment "$NR" --body-file -
          fi
          exit 1

  # ---------------------------------------------------------------- 2
  pruefen:
    name: pruefen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      # An euer Projekt anpassen. Diese Datei ist selbst ein geschützter Pfad —
      # der Agent kann die Prüfung also nicht wegkürzen, um grün zu werden.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # npm ci braucht eine Lockdatei. Die entsteht beim ersten `npm install`
      # auf deinem Rechner — solange sie fehlt, weichen wir aus, damit der
      # allererste PR nicht an einer Formalie scheitert.
      - run: npm ci || npm install
      - run: npm run typecheck
      - run: npm run lint --if-present
      - run: npm test
      - run: npm run build

      # Im Repo liegt Python, das niemand ausfuehrt — darunter
      # scripts/pfad_pruefung.py, also Gate G3 selbst. Ein Test, den kein
      # Lauf startet, ist eine Behauptung; dasselbe Muster wie "| tee" in #9
      # und "|| echo" in #7. unittest statt pytest, weil es in der
      # Standardbibliothek steht und keine Abhaengigkeit braucht.
      - name: Python-Tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          if ls tests/*_test.py >/dev/null 2>&1; then
            python3 -m unittest discover -s tests -p "*_test.py" -v
          else
            echo "Keine Python-Tests vorhanden."
          fi

  # ---------------------------------------------------------------- 3
  review:
    name: review
    needs: umfang
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Sichtbar statt still. Ein Check, der wortlos verschwindet, ist derselbe
      # Fehler wie "| tee" und "|| echo": Er sieht geprueft aus und ist es nicht.
      - name: Übersprungen, und warum
        if: needs.umfang.outputs.workflows == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "### review übersprungen"
            echo
            echo "Dieser PR ändert \`.github/workflows/\`. \`claude-code-action\` läuft"
            echo "für solche PRs nicht — sonst könnte ein PR den Prüfer umschreiben"
            echo "und sich vom veränderten Prüfer begutachten lassen."
            echo
            echo "**Geprüft wird trotzdem, nur von einem Menschen:** \`pfade\` verlangt"
            echo "für diese Pfade die Freigabe von jemandem aus \`scripts/menschen.txt\`."
          } >> "$GITHUB_STEP_SUMMARY"

          if ! gh pr view "$NR" --json comments --jq '.comments[].body' \
               | grep -q "Agenten-Checks übersprungen"; then
            {
              echo "**Agenten-Checks übersprungen.** Dieser PR ändert"
              echo "\`.github/workflows/\`, und \`claude-code-action\` verweigert für"
              echo "solche PRs den Dienst — sonst begutachtete ein umgeschriebener"
              echo "Prüfer seine eigene Umschreibung."
              echo
              echo "\`review\` und \`abnahme\` urteilen hier also nicht. Die Prüfung"
              echo "liegt bei \`pfade\` und damit bei einem Menschen aus"
              echo "\`scripts/menschen.txt\`, der den Diff gelesen hat."
            } | gh pr comment "$NR" --body-file -
          fi

      - uses: actions/checkout@v6
        if: needs.umfang.outputs.workflows != 'true'
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        if: needs.umfang.outputs.workflows != 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Du bist NICHT der Agent, der diesen Code geschrieben hat. Du bist
            der Pruefer. Deine Aufgabe ist es, Gruende zu finden, diesen PR
            NICHT zu mergen — nicht, ihn durchzuwinken.

            Lies den Diff mit: gh pr diff ${{ github.event.pull_request.number }}
            Lies CLAUDE.md und das verlinkte Issue.

            Blockiere, wenn eines davon zutrifft:
            - Der Code tut etwas anderes als das Issue verlangt
            - Ein bestehender Test wurde entschaerft, uebersprungen oder entfernt
            - Fehler werden verschluckt (leeres catch, ignorierter Rueckgabewert)
            - Geheimnisse, Zugangsdaten oder Endpunkte stehen im Klartext
            - Eine Migration oder Loeschung ist nicht umkehrbar
            - Der Diff enthaelt Aenderungen, die mit dem Issue nichts zu tun haben

            Kleinigkeiten (Stil, Benennung, Formulierung) blockieren nicht.
            Schreibe sie als Kommentar, aber urteile "frei".

            Labels, Freigaben und Abnahmekriterien sind NICHT deine Aufgabe.
            Ob ein Issue status:freigegeben traegt und ob das "fertig, wenn ..."
            erfuellt ist, prueft der Check "abnahme". Auch wenn dir dort etwas
            auffaellt: Es ist kein Blockiergrund fuer dich. Urteile
            ausschliesslich ueber den Diff.

            Der Grund steht in #44. Ein Label zu pruefen ist trivial und immer
            eindeutig, einen Diff zu beurteilen ist Arbeit mit unsicherem
            Ausgang. Wer beides darf, erfuellt die leichte Rolle zuerst und
            laesst die schwere liegen — genau das ist an PR #43 passiert, wo
            der Code in Ordnung war und trotzdem auf dem Label blockiert wurde.

            Schreibe zum Schluss die Datei urteil.json, genau so:
            {"urteil": "frei" oder "blockiert", "grund": "ein Satz",
             "befunde": ["..."]}
          claude_args: |
            --max-turns 60
            --model claude-sonnet-5
            --allowedTools "Read,Glob,Grep,Write,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Bash(git log:*),Bash(git diff:*)"

      - name: Urteil auswerten
        if: needs.umfang.outputs.workflows != 'true'
        run: |
          if [ ! -f urteil.json ]; then
            echo "::error::Der Prüfer hat kein Urteil hinterlassen. Im Zweifel blockiert."
            exit 1
          fi
          cat urteil.json >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          import json, sys
          d = json.load(open("urteil.json"))
          print(f"Urteil: {d.get('urteil')} — {d.get('grund','')}")
          for b in d.get("befunde", []):
              print(f"  - {b}")
          sys.exit(0 if d.get("urteil") == "frei" else 1)
          PY

  # ---------------------------------------------------------------- 4
  abnahme:
    name: abnahme
    needs: umfang
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Laeuft IMMER, auch bei Workflow-PRs. Gate G2 haengt an einem Label,
      # nicht an einem Urteil — dafuer braucht es keinen Agenten und keine
      # Workflow-Validierung.
      #
      # Bis #57 hing die Label-Pruefung an derselben Ausnahme wie die
      # inhaltliche Pruefung (#12). Fuer PRs auf .github/workflows/** war
      # Gate G2 damit nicht abgeschwaecht, sondern abwesend — und genau so
      # ist PR #56 gemergt worden, obwohl sein Issue nie freigegeben war.
      - name: Gate G2 — trägt das Issue status:freigegeben?
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NR: ${{ github.event.pull_request.number }}
        run: |
          text="$(gh pr view "$NR" --json body --jq .body)"

          # Codebloecke raus, BEVOR gesucht wird. Ohne das findet der Check
          # jede zitierte Issue-Nummer — der erste Lauf dieses Schritts ist
          # daran gescheitert: Im PR-Text stand ein Beispiel "Refs #31", und
          # weil #31 freigegeben ist, wurde das Gate gruen. Ein Gate, das man
          # durch Erwaehnen einer Zahl umgeht, ist keines.
          ohne_code="$(printf '%s\n' "$text" | awk '/^[[:space:]]*```/{c=!c; next} !c')"

          # Nur am Zeilenanfang. CLAUDE.md verlangt "Refs #<issue>" als eigene
          # Angabe im PR-Text, nicht als Nebensatz — und was mitten im Fliess-
          # text steht, ist eher ein Verweis als eine Zugehoerigkeit.
          nummern="$(printf '%s\n' "$ohne_code" \
            | grep -oiE '^[[:space:]]*(refs|closes|fixes)[[:space:]]+#[0-9]+' \
            | grep -oE '[0-9]+' | sort -u)"

          if [ -z "$nummern" ]; then
            echo "::error::Kein Issue verlinkt. CLAUDE.md verlangt 'Refs #<issue>' im PR-Text."
            exit 1
          fi

          # Ein freigegebenes verlinktes Issue genuegt. Mehr zu verlangen
          # wuerde PRs blockieren, die nebenbei auf einen Befund verweisen.
          for nr in $nummern; do
            labels="$(gh issue view "$nr" --json labels --jq '[.labels[].name] | join(",")')"
            echo "#$nr: ${labels:-(keine Labels)}"
            case ",$labels," in
              *,status:freigegeben,*)
                echo "Gate G2: #$nr ist freigegeben."
                exit 0
                ;;
            esac
          done

          echo "::error::Kein verlinktes Issue trägt status:freigegeben. Das ist Gate G2,"
          echo "::error::und dieses Label setzt nur ein Mensch."
          exit 1

      # Sichtbar statt still. Ein Check, der wortlos verschwindet, ist derselbe
      # Fehler wie "| tee" und "|| echo": Er sieht geprueft aus und ist es nicht.
      - name: Übersprungen, und warum
        if: needs.umfang.outputs.workflows == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "### abnahme übersprungen"
            echo
            echo "Dieser PR ändert \`.github/workflows/\`. \`claude-code-action\` läuft"
            echo "für solche PRs nicht — sonst könnte ein PR den Prüfer umschreiben"
            echo "und sich vom veränderten Prüfer begutachten lassen."
            echo
            echo "**Geprüft wird trotzdem, nur von einem Menschen:** \`pfade\` verlangt"
            echo "für diese Pfade die Freigabe von jemandem aus \`scripts/menschen.txt\`."
          } >> "$GITHUB_STEP_SUMMARY"

          if ! gh pr view "$NR" --json comments --jq '.comments[].body' \
               | grep -q "Agenten-Checks übersprungen"; then
            {
              echo "**Agenten-Checks übersprungen.** Dieser PR ändert"
              echo "\`.github/workflows/\`, und \`claude-code-action\` verweigert für"
              echo "solche PRs den Dienst — sonst begutachtete ein umgeschriebener"
              echo "Prüfer seine eigene Umschreibung."
              echo
              echo "\`review\` und \`abnahme\` urteilen hier also nicht. Die Prüfung"
              echo "liegt bei \`pfade\` und damit bei einem Menschen aus"
              echo "\`scripts/menschen.txt\`, der den Diff gelesen hat."
            } | gh pr comment "$NR" --body-file -
          fi

      - uses: actions/checkout@v6
        if: needs.umfang.outputs.workflows != 'true'
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        if: needs.umfang.outputs.workflows != 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Pruefe ausschliesslich eines: Erfuellt dieser PR das Abnahme-
            kriterium des verlinkten Issues — den Abschnitt "Fertig, wenn …"?

            Finde das Issue ueber den PR-Text (Refs, Closes, Fixes).
            Gibt es kein verlinktes Issue: blockieren, Grund
            "kein Issue verlinkt".
            Hat das Issue kein Abnahmekriterium: blockieren, Grund
            "Issue ohne Abnahmekriterium".
            Traegt das Issue nicht das Label status:freigegeben: blockieren,
            Grund "Issue nicht freigegeben" — das ist Gate G2 und bleibt beim
            Menschen.

            Sonst: Weise am Diff nach, wo das Kriterium erfuellt wird — welche
            Datei, welche Zeile, welcher Test deckt es ab. Findest du keinen
            Nachweis, blockierst du. "Sieht plausibel aus" ist kein Nachweis.

            Drei Regeln, damit dein Urteil reproduzierbar ist. Am 2026-09-11
            wurde derselbe Commit zweimal geprueft und einmal frei, einmal
            blockiert beurteilt (#16). Ein Gate ist so stark wie seine
            schlechteste Entscheidung, nicht wie seine beste.

            1. Besteht das Kriterium aus mehreren Teilen ("und", Aufzaehlung,
               nummerierte Liste), geh sie EINZELN durch und belege jeden Teil
               einzeln. Nenne sie im Feld "nachweis" der Reihe nach. Ist auch
               nur einer unbelegt, blockierst du — und sagst welcher.
            2. Aussagen des PR-Textes sind NIE ein Beleg. Sie sagen dir nur,
               wo du suchen sollst. Was dort nicht steht, ist nicht erfuellt,
               auch wenn der PR-Text es behauptet oder begruendet, warum es
               fehlt.
            3. Bist du unsicher, blockierst du und schreibst den Zweifel in
               das Feld "grund". Ein benannter Zweifel ist fuer den naechsten
               Leser brauchbar, ein verschwiegener nicht.

            Schreibe die Datei abnahme.json:
            {"urteil": "frei" oder "blockiert", "issue": <nummer oder null>,
             "kriterium": "…", "nachweis": "…", "grund": "…"}
          claude_args: |
            --max-turns 60
            --model claude-sonnet-5
            --allowedTools "Read,Glob,Grep,Write,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*)"

      - name: Urteil auswerten
        if: needs.umfang.outputs.workflows != 'true'
        run: |
          if [ ! -f abnahme.json ]; then
            echo "::error::Kein Abnahmeurteil hinterlassen. Im Zweifel blockiert."
            exit 1
          fi
          cat abnahme.json >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          import json, sys
          d = json.load(open("abnahme.json"))
          print(f"Issue:     #{d.get('issue')}")
          print(f"Kriterium: {d.get('kriterium','')}")
          print(f"Nachweis:  {d.get('nachweis','')}")
          print(f"Urteil:    {d.get('urteil')} — {d.get('grund','')}")
          sys.exit(0 if d.get("urteil") == "frei" else 1)
          PY

  # ---------------------------------------------------------------- 4b
  # Das fuenfte Gate, und das einzige, das die Anwendung STARTET.
  #
  # PR #74 und #75 sind durch alle vier gegangen, 98 Tests gruen — und beim
  # ersten Klick auf "Aufnahme starten" passierte nichts (#76). Keines der
  # vier prueft, ob das Ding laeuft: pfade liest Dateinamen, pruefen liest
  # Unit-Tests, review und abnahme lesen den Diff.
  #
  # NICHT required, bewusst. Dieser Pruefer startet echte Vorgaenge und wird
  # der unzuverlaessigste von allen sein. Ein Gate, das aus Flakigkeit
  # blockiert, bringt Leute dazu, Gates zu umgehen. Erst beobachten, dann
  # entscheiden — siehe #77.
  probe:
    name: probe
    needs: umfang
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Übersprungen, und warum
        if: needs.umfang.outputs.workflows == 'true'
        run: |
          {
            echo "### probe übersprungen"
            echo
            echo "Dieser PR ändert \`.github/workflows/\`, und \`claude-code-action\`"
            echo "läuft für solche PRs nicht — dieselbe Sperre wie bei review"
            echo "und abnahme, siehe #12."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v6
        if: needs.umfang.outputs.workflows != 'true'

      - name: Was hat der PR angefasst?
        if: needs.umfang.outputs.workflows != 'true'
        id: umfang_dateien
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NR: ${{ github.event.pull_request.number }}
        run: |
          # Der Pruefer bekommt die Liste hier, damit er selbst kein gh
          # braucht. Wer die Anwendung startet, soll nicht auch noch am Repo
          # schreiben duerfen.
          {
            echo "dateien<<ENDE"
            gh pr diff "$NR" --name-only
            echo "ENDE"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: needs.umfang.outputs.workflows != 'true'
        with:
          node-version: "22"
      - run: npm ci || npm install
        if: needs.umfang.outputs.workflows != 'true'

      - uses: anthropics/claude-code-action@v1
        if: needs.umfang.outputs.workflows != 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Du bist der Rauchtest. Die anderen Pruefer LESEN — du STARTEST.

            Dieser PR hat diese Dateien angefasst:

            ${{ steps.umfang_dateien.outputs.dateien }}

            Finde heraus, was man davon starten kann, und starte es. Ein
            Server: hochfahren, seine Wege abrufen, wieder beenden. Ein
            Skript: mit Beispieldaten aufrufen. Eine Seite: ausliefern
            lassen und pruefen, dass sie nicht leer ist.

            WAS DU PRUEFST
            Nicht, ob die Fachlogik stimmt — das haben review und abnahme
            getan. Du pruefst, ob das Ding laeuft und ob es SAGT, wenn es
            nicht laufen kann.

            In dieser Umgebung fehlen Abhaengigkeiten, die es auf dem
            Rechner des Nutzers gibt: Whisper, ein Mikrofon, Audiogeraete.
            Das ist kein Grund zu blockieren. Im Gegenteil — genau hier
            zeigt sich, was dieses Gate finden soll:

            Ein Start, der ohne Abhaengigkeit scheitert, MUSS das melden.
            Faellt die Anwendung stattdessen stumm in den Ausgangszustand
            zurueck oder meldet Normalbetrieb, blockierst du. Ein Werkzeug,
            das schweigend nicht funktioniert, ist schlimmer als eines, das
            laut scheitert — der Nutzer merkt es sonst erst im Meeting.

            Blockiere ausserdem, wenn:
            - sich gar nichts starten laesst, obwohl der PR etwas Startbares
              enthaelt
            - ein Vorgang haengt und nicht von selbst zurueckkommt
            - ein Fehler nur im Log steht, aber die Oberflaeche oder die
              Antwort Normalzustand meldet

            Raeum auf: Was du startest, beendest du auch.

            Schreibe zum Schluss probe.json, genau so:
            {"urteil": "frei" oder "blockiert",
             "was_getan": "was du gestartet und aufgerufen hast",
             "was_passiert": "was dabei herauskam",
             "grund": "ein Satz, nur wenn blockiert"}
          claude_args: |
            --max-turns 60
            --model claude-sonnet-5
            --allowedTools "Read,Glob,Grep,Write,Bash(npm:*),Bash(python3:*),Bash(node:*),Bash(curl:*),Bash(sleep:*),Bash(kill:*),Bash(ls:*),Bash(cat:*)"

      - name: Urteil auswerten
        if: needs.umfang.outputs.workflows != 'true'
        run: |
          if [ ! -f probe.json ]; then
            echo "::error::Der Rauchtest hat kein Urteil hinterlassen. Im Zweifel blockiert."
            exit 1
          fi
          cat probe.json >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          import json, sys
          d = json.load(open("probe.json"))
          print(f"Getan:     {d.get('was_getan','')}")
          print(f"Passiert:  {d.get('was_passiert','')}")
          print(f"Urteil:    {d.get('urteil')} — {d.get('grund','')}")
          sys.exit(0 if d.get("urteil") == "frei" else 1)
          PY

  # ---------------------------------------------------------------- 5
  freischalten:
    name: auto-merge freischalten
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.draft == false
    steps:
      - name: Auto-Merge einschalten
        env:
          # NICHT github.token: Das Standard-Token von Actions darf
          # enablePullRequestAutoMerge nicht aufrufen, unabhaengig von den
          # permissions: im Workflow. BOT_TOKEN ist ein klassisches Token des
          # Maschinenkontos quizberater — dadurch traegt ein autonomer Merge
          # dessen Namen und ist in der Historie von einem menschlichen
          # unterscheidbar. Siehe #18 und #10.
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
          # Dieser Job hat bewusst keinen Checkout — er braucht keine Dateien.
          # Ohne Arbeitsverzeichnis findet gh aber auch kein Repo und bricht ab
          # mit "fatal: not a git repository". GH_REPO ersetzt den Checkout.
          GH_REPO: ${{ github.repository }}
          NR: ${{ github.event.pull_request.number }}
        run: |
          # Ein fehlendes Secret ist kein erwarteter Fall. Ohne diese Pruefung
          # liefe gh in einen Authentifizierungsfehler, der Fallback unten
          # kennt ihn nicht, und der Job wuerde rot — aber mit einer Meldung,
          # aus der niemand das fehlende Secret ablesen kann.
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Secret BOT_TOKEN ist nicht gesetzt."
            echo "::error::Ohne das Token kann Auto-Merge nicht aktiviert werden."
            exit 1
          fi

          # Schaltet nur die Absicht frei. Gemergt wird erst, wenn pfade,
          # pruefen, review und abnahme gruen sind — das entscheidet GitHub,
          # nicht dieser Job und nicht der Agent.
          if ausgabe="$(gh pr merge "$NR" --auto --squash --delete-branch 2>&1)"; then
            echo "Auto-Merge scharf. GitHub mergt, sobald alle vier Checks gruen sind."
            exit 0
          fi

          echo "$ausgabe"

          # Nur diese Faelle sind erwartet. Bei allem anderen wird der Job rot:
          # ein Fallback, der jeden Fehler auffaengt, ist an dieser Stelle
          # dasselbe wie kein Job — er meldet gruen, ohne etwas getan zu haben.
          case "$ausgabe" in
            *"draft state"*|*"already enabled"*|*"not mergeable"*|*"Merge conflict"*)
              echo "Erwarteter Fall. Auto-Merge bleibt aus, der PR bleibt offen."
              exit 0
              ;;
          esac

          echo "::error::Auto-Merge liess sich nicht aktivieren, und der Grund"
          echo "::error::steht nicht auf der Liste der erwarteten Faelle."
          exit 1
